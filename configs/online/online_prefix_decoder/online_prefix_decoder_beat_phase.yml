# Beat-phase conditioning mixin. Compose with a future_visibility + chunk_size
# config via $include, with this file listed last so its overrides win. Example:
#
#   $include:
#     - configs/online/online_prefix_decoder/online_prefix_decoder_future_visibility_0_chunk_size_50.yml
#     - configs/online/online_prefix_decoder/online_prefix_decoder_beat_phase.yml
#
# The fv+k config brings in chunk_length/future_visibility. This mixin adds the
# beat-phase conditioner flag, points data at the beat-phase preprocessed root,
# and lowers the LR for a fine-tune warm-start from a baseline checkpoint.

# Data: new root with beat_cond.pt per window
data_base_dir: "stream_music_gen_data/precompute_audio_mixdown_20s_beat"

# From-scratch training matching the baseline's 200K-step recipe exactly, so
# the only difference between this run and the baseline is the beat-phase
# conditioner. $vars.total_steps in the base has already been expanded into
# train_steps / LinearWarmupCosineDecay.total_iters at that point, so the
# final fields are overridden directly (setting total_steps here wouldn't
# re-template the already-expanded ones).
train_steps: 200000
checkpoint_interval: 20000
sample_interval: 20000

# Optimizer / scheduler identical to baseline.
AdamW.lr: !!float 1e-4
LinearWarmupCosineDecay.warmup_iters: 10000
LinearWarmupCosineDecay.total_iters: 200000
LinearWarmupCosineDecay.eta_min: !!float 1e-5

# Model: enable the beat-phase conditioner
OnlinePrefixDecoderTransformerMultiOut.use_beat_phase: true
OnlinePrefixDecoderTransformerMultiOut.time_sig_vocab_size: 16

# Lit module (argbind without_prefix): mirror flags so conditioner is plumbed
use_beat_phase: true
time_sig_vocab_size: 16
