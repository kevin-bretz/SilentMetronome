# DiT-style per-layer beat-phase conditioning mixin, minimal variant,
# matched-schedule 200K version.
#
# Identical to ``..._beat_phase_dit_minimal.yml`` except the schedule is
# pinned to the 200K cosine that the original ``..._beat_phase_dit.yml``
# uses. This isolates the conditioning content (full vs minimal) from the
# training-length confound between the previous minimal-300K run and the
# original-DiT-200K run.

# Data: same root with beat_cond.pt per window
data_base_dir: "stream_music_gen_data/precompute_audio_mixdown_20s_beat"

# Match original DiT 200K schedule.
train_steps: 200000
checkpoint_interval: 20000
sample_interval: 20000

AdamW.lr: !!float 1e-4
LinearWarmupCosineDecay.warmup_iters: 10000
LinearWarmupCosineDecay.total_iters: 200000
LinearWarmupCosineDecay.eta_min: !!float 1e-5

# Model: DiT per-layer ON, additive OFF, MINIMAL conditioning.
OnlinePrefixDecoderTransformerMultiOut.use_beat_phase: false
OnlinePrefixDecoderTransformerMultiOut.use_beat_phase_dit_cond: true
OnlinePrefixDecoderTransformerMultiOut.beat_dit_cond_mlp_expansion: 4
OnlinePrefixDecoderTransformerMultiOut.beat_dit_cond_minimal: true
OnlinePrefixDecoderTransformerMultiOut.time_sig_vocab_size: 16

# Lit module (argbind without_prefix): mirror flags so the model gets them.
use_beat_phase: false
use_beat_phase_dit_cond: true
beat_dit_cond_mlp_expansion: 4
beat_dit_cond_minimal: true
time_sig_vocab_size: 16
