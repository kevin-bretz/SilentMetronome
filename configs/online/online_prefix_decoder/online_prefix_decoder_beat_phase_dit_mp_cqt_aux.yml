# Full-cond DiT beat-phase cond + multipitch aux + CQT aux.
#
# The cond side is the full DiT beat-phase cond (phase + per-frame BPM +
# global BPM + bar position + time signature). The aux side supervises
# target-stem multipitch (BCE on presence + masked MSE on velocity) and
# target-stem CQT (MSE+cos on 84-bin log-mag). Tests whether richer aux
# supervision (note identity + spectral envelope) on top of explicit
# beat-phase cond improves generation. Compared with the aux-only
# variant, this isolates cond + rich aux vs rich aux only.

data_base_dir: "stream_music_gen_data/precompute_audio_mixdown_20s_beat"

compile: false
num_workers: 8

train_steps: 200000
checkpoint_interval: 20000
sample_interval: 20000

AdamW.lr: !!float 1e-4
LinearWarmupCosineDecay.warmup_iters: 10000
LinearWarmupCosineDecay.total_iters: 200000
LinearWarmupCosineDecay.eta_min: !!float 1e-5

# Model: full DiT beat cond + multipitch aux + CQT aux.
OnlinePrefixDecoderTransformerMultiOut.use_beat_phase_dit_cond: true
OnlinePrefixDecoderTransformerMultiOut.beat_dit_cond_mlp_expansion: 4
OnlinePrefixDecoderTransformerMultiOut.time_sig_vocab_size: 16
OnlinePrefixDecoderTransformerMultiOut.use_multipitch_aux_head: true
OnlinePrefixDecoderTransformerMultiOut.multipitch_aux_head_hidden_dim: 256
OnlinePrefixDecoderTransformerMultiOut.multipitch_dim: 128
OnlinePrefixDecoderTransformerMultiOut.use_cqt_aux_head: true
OnlinePrefixDecoderTransformerMultiOut.cqt_aux_head_hidden_dim: 256
OnlinePrefixDecoderTransformerMultiOut.cqt_dim: 84

# Lit module mirror flags.
use_beat_phase_dit_cond: true
beat_dit_cond_mlp_expansion: 4
time_sig_vocab_size: 16
use_multipitch_aux_head: true
multipitch_aux_head_hidden_dim: 256
multipitch_aux_head_weight: !!float 1.0
multipitch_dim: 128
use_cqt_aux_head: true
cqt_aux_head_hidden_dim: 256
cqt_aux_head_weight: !!float 1.0
cqt_dim: 84
