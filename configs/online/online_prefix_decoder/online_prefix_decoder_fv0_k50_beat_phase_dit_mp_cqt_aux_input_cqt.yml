$include:
  - configs/online/online_prefix_decoder/online_prefix_decoder_base.yml
  - configs/online/online_prefix_decoder/online_prefix_decoder_beat_phase_dit_mp_cqt_aux.yml

# Phase H: Phase F + input-mix CQT aux head.
# Adds an additional MLP head supervised against the precomputed
# input-mix CQT (84-bin log-magnitude). Same family of signals as the
# existing target-stem CQT head, but orthogonal: this one forces the
# hidden state to retain a faithful spectral picture of WHAT THE MODEL
# IS HEARING, rather than what it should generate. Dropped at inference.

OnlinePrefixDecoderTransformerMultiOut.future_visibility: 0
OnlinePrefixDecoderTransformerMultiOut.chunk_length: 50

# Model — instantiate the input-CQT head.
OnlinePrefixDecoderTransformerMultiOut.use_input_cqt_aux_head: true
OnlinePrefixDecoderTransformerMultiOut.input_cqt_aux_head_hidden_dim: 256
OnlinePrefixDecoderTransformerMultiOut.input_cqt_dim: 84

# Lit module mirror flags.
use_input_cqt_aux_head: true
input_cqt_aux_head_hidden_dim: 256
input_cqt_aux_head_weight: !!float 1.0
input_cqt_dim: 84
