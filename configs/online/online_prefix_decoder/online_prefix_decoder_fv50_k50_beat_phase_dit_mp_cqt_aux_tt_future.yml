$include:
  - configs/online/online_prefix_decoder/online_prefix_decoder_base.yml
  - configs/online/online_prefix_decoder/online_prefix_decoder_beat_phase_dit_mp_cqt_aux.yml

# fv=+50, DiT beat cond, mp + cqt aux, plus a target-stem future-token
# aux head.
#
# Feature-prediction future heads (mp/cqt at t+δ) train cleanly but can
# be satisfied by routing future-mix attention outputs to the head
# without ever touching the generation pathway, so the next-token circuit
# keeps ignoring future-mix.
#
# This head instead puts the supervision directly on the generation
# pathway. It predicts the actual target-stem DAC token (same vocabulary
# as the main next-token head) at mangled position p+δ from h_t. Two key
# differences from feature-prediction heads:
#   1) The target token at p+δ is not in the model's input at p (it is
#      autoregressively in the future), so the task cannot be solved by
#      copying attention outputs.
#   2) The most useful information for predicting the target stem at p+δ
#      is what the accompaniment is doing around frame p+δ, which lives
#      in the future-mix tokens. Gradient pressure to attend future-mix
#      is therefore real here.
#
# At fv=+50 the max δ (40) fits inside the lookahead with 10 frames margin.

OnlinePrefixDecoderTransformerMultiOut.future_visibility: 50
OnlinePrefixDecoderTransformerMultiOut.chunk_length: 50

# Target-stem future-token head (CE on patterned tokens).
OnlinePrefixDecoderTransformerMultiOut.use_target_token_future_aux_head: true
OnlinePrefixDecoderTransformerMultiOut.target_token_future_aux_head_hidden_dim: 256
OnlinePrefixDecoderTransformerMultiOut.future_aux_offsets: [10, 25, 40]

# Lit module mirror flags.
use_target_token_future_aux_head: true
target_token_future_aux_head_hidden_dim: 256
target_token_future_aux_head_weight: !!float 1.0
future_aux_offsets: [10, 25, 40]
