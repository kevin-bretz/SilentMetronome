###############################################################################
# pipeline.conf: configuration for run_pipeline.sh
#
# Edit this file, then run:  ./submit.sh
###############################################################################

###############################################################################
# MODEL
###############################################################################

# Model type: "dec_online" (k=1, frame-by-frame) or "prefix_decoder_online" (k>1, chunked)
MODEL_TYPE="prefix_decoder_online"

# Future visibility in frames at 50 Hz (50 = 1 s lookahead, -50 = 1 s predict-ahead, 0 = causal)
FUTURE_VISIBILITY=50

# Chunk size in frames, only used when MODEL_TYPE="prefix_decoder_online"
CHUNK_SIZE=50

###############################################################################
# TRAINING (leave empty for baseline defaults, auto-set per model type + GPUs)
#
#                        dec_online    prefix_decoder_online
#   TRAIN_STEPS          100,000       200,000
#   BATCH_SIZE (total)   64            16          (divided by NUM_GPUS)
#   CHECKPOINT_INTERVAL  10,000        20,000
#   SAMPLE_INTERVAL      10,000        20,000
###############################################################################

TRAIN_STEPS=""
BATCH_SIZE=""
CHECKPOINT_INTERVAL=""
SAMPLE_INTERVAL=""
LEARNING_RATE=1e-4      # same for both model types
WARMUP_STEPS=10000      # same for both model types
PRECISION="bf16-mixed"
COMPILE="false"          # torch.compile, disable on older GPUs (2080 Ti) where it hangs

###############################################################################
# EVALUATION
###############################################################################

NUM_EVAL_SAMPLES=1024
EVAL_BATCH_SIZE=64
EVAL_SPLIT="valid"

###############################################################################
# SKIP TRAINING (evaluate an existing checkpoint instead)
###############################################################################

SKIP_TRAINING="true"
EVAL_CKPT_PATH="models/pref_dec_online_fv50_k50/step=200000.ckpt"       # e.g. "models/pref_dec_online_fv50_k50/step=200000.ckpt"

###############################################################################
# EXPERIMENT NAME (leave empty for auto-generated name)
###############################################################################

EXP_NAME="pref_dec_online_fv50_k50"

###############################################################################
# SLURM
###############################################################################

# Partition: gpu-a100-80g (2×A100 80 GB), gpu-l4-24g (4×L4 24 GB),
#            gpu-2080ti-11g (4×2080 Ti 11 GB), gpu-mig-40g (MIG ~40 GB)
#            gpu-short (mixed, 4h limit, use GPU_TYPE to pick)
PARTITION="gpu-short"
NUM_GPUS=1
GPU_TYPE="a100"         # GPU type constraint (a100, l4, 2080_ti, or "" for any)
TIME_LIMIT="0-04:00:00"
CPUS_PER_TASK=16
MEM="80G"
